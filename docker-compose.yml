version: '3.8'

services:
  geoserver:
    image: kartoza/geoserver:latest
    container_name: geoserver_mosdac
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=myadminpassword
      - INITIAL_MEMORY=1G
      - MAXIMUM_MEMORY=2G
    ports:
      - "8080:8080"
    volumes:
      - ./data:/opt/geoserver/data_dir/cyclone_data:z
    restart: unless-stopped

  geoserver-init:
    image: python:3.10-alpine
    container_name: geoserver_init
    depends_on:
      - geoserver
    volumes:
      - ./scripts:/scripts:z
    environment:
      - GEOSERVER_HOST=geoserver
      - GEOSERVER_PORT=8080
    command: >
      sh -c "pip install --quiet requests && python /scripts/setup_geoserver.py"
    restart: "no"